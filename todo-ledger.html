<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — a task list</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #f1efe4;
    --paper-raised: #f8f6ec;
    --ink: #23291f;
    --ink-soft: #5a6152;
    --rule: #cfc9b2;
    --rule-soft: #ddd8c4;
    --accent: #2b4a5e;
    --accent-soft: #d9e2e2;
    --moss: #5c7a54;
    --moss-soft: #dde6d5;
    --brick: #8a3f34;
    --brick-soft: #ecdbd6;
    --shadow: rgba(35, 41, 31, 0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    min-height: 100vh;
    padding: 6vh 20px 8vh;
    background-image:
      linear-gradient(var(--rule-soft) 1px, transparent 1px);
    background-size: 100% 42px;
    background-position: 0 168px;
  }

  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden;
    clip: rect(0,0,0,0);
    white-space: nowrap;
    border: 0;
  }

  .sheet {
    max-width: 620px;
    margin: 0 auto;
  }

  .masthead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-bottom: 20px;
    margin-bottom: 22px;
    border-bottom: 2px solid var(--ink);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-style: italic;
    font-size: 34px;
    margin: 0;
    letter-spacing: -0.01em;
  }

  .date-stamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: right;
    line-height: 1.5;
  }

  .entry-row {
    display: flex;
    gap: 10px;
    margin-bottom: 6px;
  }

  .entry-row input[type="text"] {
    flex: 1;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--rule);
    border-radius: 3px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .entry-row input[type="text"]::placeholder {
    color: #9a967f;
  }

  .entry-row input[type="text"]:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .entry-row button {
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 14px;
    color: #f8f6ec;
    background: var(--ink);
    border: none;
    border-radius: 3px;
    padding: 0 20px;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.05s ease;
  }

  .entry-row button:hover { background: #3a4231; }
  .entry-row button:active { transform: scale(0.97); }

  .entry-row button:focus-visible,
  input:focus-visible,
  .task-check:focus-visible,
  .task-del:focus-visible,
  .filter-btn:focus-visible,
  .clear-btn:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .field-error {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--brick);
    margin: 4px 2px 14px;
    min-height: 16px;
  }

  .filters {
    display: flex;
    gap: 4px;
    margin: 18px 0 4px;
  }

  .filter-btn {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    background: transparent;
    border: 1px solid transparent;
    border-radius: 3px;
    padding: 5px 10px;
    cursor: pointer;
  }

  .filter-btn.active {
    color: var(--ink);
    background: var(--paper-raised);
    border-color: var(--rule);
  }

  .filter-btn:hover:not(.active) { color: var(--ink); }

  ul.tasks {
    list-style: none;
    margin: 10px 0 0;
    padding: 0;
  }

  li.task {
    display: flex;
    align-items: flex-start;
    gap: 12px;
    padding: 14px 2px;
    border-bottom: 1px solid var(--rule-soft);
    animation: settle 0.2s ease;
  }

  @keyframes settle {
    from { opacity: 0; transform: translateY(-4px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    li.task { animation: none; }
  }

  li.task:last-child { border-bottom: none; }

  .task-check {
    flex: none;
    width: 20px;
    height: 20px;
    margin-top: 2px;
    border-radius: 50%;
    border: 1.5px solid var(--ink-soft);
    background: transparent;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }

  .task-check.done {
    border-color: var(--moss);
    background: var(--moss-soft);
  }

  .task-check svg { display: none; width: 11px; height: 11px; }
  .task-check.done svg { display: block; }
  .task-check.done svg path { stroke: var(--moss); }

  .task-body {
    flex: 1;
    min-width: 0;
  }

  .task-text {
    font-size: 15.5px;
    line-height: 1.5;
    color: var(--ink);
    word-wrap: break-word;
  }

  .task-text.done {
    color: #9a967f;
    text-decoration: line-through;
    text-decoration-color: #b8b39c;
  }

  .task-meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: #9a967f;
    margin-top: 3px;
  }

  .task-del {
    flex: none;
    background: transparent;
    border: none;
    color: #9a967f;
    cursor: pointer;
    padding: 4px;
    border-radius: 3px;
    opacity: 0;
    transition: opacity 0.12s ease, color 0.12s ease;
  }

  li.task:hover .task-del,
  li.task:focus-within .task-del { opacity: 1; }

  .task-del:hover { color: var(--brick); }

  .empty {
    text-align: center;
    padding: 48px 12px;
    color: var(--ink-soft);
  }

  .empty-title {
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-size: 19px;
    margin-bottom: 4px;
    color: var(--ink);
  }

  .empty-sub {
    font-size: 13.5px;
  }

  .ledger-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 2px solid var(--ink);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
  }

  .clear-btn {
    background: transparent;
    border: none;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--brick);
    cursor: pointer;
    padding: 2px;
    text-decoration: underline;
    text-decoration-color: var(--brick-soft);
    text-underline-offset: 3px;
  }

  .clear-btn:hover { text-decoration-color: var(--brick); }

  .loading-line {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    padding: 20px 2px;
  }

  @media (max-width: 480px) {
    h1 { font-size: 27px; }
    .masthead { flex-direction: column; align-items: flex-start; gap: 8px; }
    .date-stamp { text-align: left; }
  }
</style>
</head>
<body>
<h2 class="sr-only">Ledger, a task list app. Enter a task and press add, tap the circle to mark a task complete, use the trash icon to delete it. Tasks are saved automatically.</h2>

<div class="sheet">
  <div class="masthead">
    <h1>Ledger</h1>
    <div class="date-stamp" id="dateStamp"></div>
  </div>

  <div class="entry-row">
    <input type="text" id="taskInput" placeholder="Write down what needs doing" maxlength="200" />
    <button id="addBtn" type="button">Add</button>
  </div>
  <div class="field-error" id="fieldError"></div>

  <div class="filters" id="filters">
    <button class="filter-btn active" data-filter="all" type="button">all</button>
    <button class="filter-btn" data-filter="active" type="button">open</button>
    <button class="filter-btn" data-filter="done" type="button">settled</button>
  </div>

  <div id="listArea">
    <div class="loading-line">Opening the ledger…</div>
  </div>

  <div class="ledger-footer" id="ledgerFooter" style="display:none;">
    <span id="tallyText">0 entries</span>
    <button class="clear-btn" id="clearBtn" type="button" style="display:none;">clear settled</button>
  </div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'ledger-tasks';
  let tasks = [];
  let filter = 'all';
  let idCounter = 0;
  let storageReady = false;

  const input = document.getElementById('taskInput');
  const addBtn = document.getElementById('addBtn');
  const fieldError = document.getElementById('fieldError');
  const listArea = document.getElementById('listArea');
  const ledgerFooter = document.getElementById('ledgerFooter');
  const tallyText = document.getElementById('tallyText');
  const clearBtn = document.getElementById('clearBtn');
  const filtersEl = document.getElementById('filters');
  const dateStamp = document.getElementById('dateStamp');

  function stampDate(){
    const now = new Date();
    const dateStr = now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    dateStamp.innerHTML = dateStr;
  }
  stampDate();

  function checkIcon(){
    return '<svg viewBox="0 0 12 12" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M2 6.2L4.6 9L10 3" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function loadTasks(){
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if(raw){
        tasks = JSON.parse(raw);
        idCounter = tasks.reduce(function(max, t){ return Math.max(max, t.id); }, 0) + 1;
      }
    } catch(e){
      tasks = [];
    }
    storageReady = true;
    render();
  }

  function saveTasks(){
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch(e) {
      console.error('Could not save tasks', e);
    }
  }

  function formatMeta(task){
    const d = new Date(task.createdAt);
    const timeStr = d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    return task.done ? 'settled · added ' + timeStr : 'added ' + timeStr;
  }

  function render(){
    if(!storageReady) return;

    const visible = tasks.filter(function(t){
      if(filter === 'active') return !t.done;
      if(filter === 'done') return t.done;
      return true;
    });

    if(tasks.length === 0){
      ledgerFooter.style.display = 'none';
      listArea.innerHTML =
        '<div class="empty">' +
          '<div class="empty-title">The page is blank</div>' +
          '<div class="empty-sub">Write your first entry above.</div>' +
        '</div>';
      return;
    }

    ledgerFooter.style.display = 'flex';

    if(visible.length === 0){
      listArea.innerHTML =
        '<div class="empty">' +
          '<div class="empty-title">Nothing here</div>' +
          '<div class="empty-sub">No entries match this view.</div>' +
        '</div>';
    } else {
      const ul = document.createElement('ul');
      ul.className = 'tasks';
      visible.forEach(function(task){
        const li = document.createElement('li');
        li.className = 'task';

        const check = document.createElement('button');
        check.className = 'task-check' + (task.done ? ' done' : '');
        check.setAttribute('aria-label', task.done ? 'Mark as open' : 'Mark as settled');
        check.innerHTML = checkIcon();
        check.addEventListener('click', function(){
          task.done = !task.done;
          saveTasks();
          render();
        });

        const body = document.createElement('div');
        body.className = 'task-body';

        const text = document.createElement('div');
        text.className = 'task-text' + (task.done ? ' done' : '');
        text.textContent = task.text;

        const meta = document.createElement('div');
        meta.className = 'task-meta';
        meta.textContent = formatMeta(task);

        body.appendChild(text);
        body.appendChild(meta);

        const del = document.createElement('button');
        del.className = 'task-del';
        del.setAttribute('aria-label', 'Delete entry');
        del.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16M9 6V4h6v2M6 6l1 14h10l1-14" stroke-linecap="round" stroke-linejoin="round"/></svg>';
        del.addEventListener('click', function(){
          tasks = tasks.filter(function(t){ return t.id !== task.id; });
          saveTasks();
          render();
        });

        li.appendChild(check);
        li.appendChild(body);
        li.appendChild(del);
        ul.appendChild(li);
      });
      listArea.innerHTML = '';
      listArea.appendChild(ul);
    }

    const doneCount = tasks.filter(function(t){ return t.done; }).length;
    const openCount = tasks.length - doneCount;
    tallyText.textContent = openCount + ' open · ' + doneCount + ' settled';
    clearBtn.style.display = doneCount > 0 ? 'inline' : 'none';
  }

  function addTask(){
    const val = input.value.trim();
    if(!val){
      fieldError.textContent = 'Write something before adding it';
      input.focus();
      return;
    }
    fieldError.textContent = '';
    tasks.unshift({ id: idCounter++, text: val, done: false, createdAt: Date.now() });
    input.value = '';
    saveTasks();
    render();
    input.focus();
  }

  addBtn.addEventListener('click', addTask);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter') addTask();
  });
  input.addEventListener('input', function(){
    if(fieldError.textContent) fieldError.textContent = '';
  });

  clearBtn.addEventListener('click', function(){
    tasks = tasks.filter(function(t){ return !t.done; });
    saveTasks();
    render();
  });

  filtersEl.addEventListener('click', function(e){
    const btn = e.target.closest('.filter-btn');
    if(!btn) return;
    filter = btn.dataset.filter;
    Array.from(filtersEl.children).forEach(function(b){ b.classList.toggle('active', b === btn); });
    render();
  });

  loadTasks();
})();
</script>
</body>
</html>
